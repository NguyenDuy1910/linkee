# Local development database only:  docker compose up -d db   (then `npm run dev`)
# Production runs on the homelab: stacks/linkee (app) + the shared stacks/postgres
# (database `linkee`). See README.md → "Deploy (homelab)".
services:
  db:
    # Matches the existing local volume (initialized with 16); production is PG 17.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkee
      POSTGRES_PASSWORD: linkee
      POSTGRES_DB: linkee
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkee -d linkee"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
