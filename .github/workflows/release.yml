name: release

# main → checks → image ghcr.io/<owner>/linkee:sha-<7> → homelab bump-image → deploy.
# Needs repo secret HOMELAB_DISPATCH_TOKEN (fine-grained, Contents: read/write on the homelab repo).
on:
  push:
    branches: [main]
    # The UX preview ships separately (ux-preview.yml); its changes don't rebuild or redeploy the app.
    paths-ignore:
      - "ux_preview/**"
      - ".github/workflows/ux-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ci-placeholder-secret-ci-placeholder
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  image:
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Image reference
        id: ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/linkee:sha-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to homelab
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          gh api repos/NguyenDuy1910/homelab/dispatches -f event_type=bump-image \
            -f 'client_payload[stack]=linkee' -f 'client_payload[service]=linkee' \
            -f "client_payload[image]=${IMAGE}"
